[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "berkelium"
version = "0.1.0.dev0"
description = "Berkelium core: AI-native computational engineering — schemas, expressions, geometry IR, CEMs, validation, dataset factory, model gateway."
readme = "README.md"
requires-python = ">=3.11"
# License: UNRESOLVED (open decision U8 in docs/ARCHITECTURE_DECISIONS.md).
# Recommendation recorded there: Apache-2.0. No LICENSE file is added until the owners decide.
dependencies = [
  "pydantic>=2.7,<3",
  "numpy>=1.26",
  "rfc8785>=0.1.4",
  "jsonpatch>=1.33",
]

[project.optional-dependencies]
occt = ["cadquery-ocp-novtk>=7.9"]          # exact BREP backend (OCCT is LGPL-2.1 + exception; dynamic dependency)
mesh = ["manifold3d>=3.5", "trimesh>=4"]   # mesh backend + STL/GLB export
api = ["fastapi>=0.110", "uvicorn>=0.29"]
physics = ["scikit-fem>=12.0", "meshio>=5.3", "scipy>=1.11"]   # BSD-3 / MIT / BSD-3, in-process
# Gmsh (GPL-2.0-or-later) and CalculiX/OpenFOAM (GPL) are EXTERNAL EXECUTABLES, never Python deps (ADR-016).
model = ["httpx>=0.27"]                    # OpenAI-compatible providers (vLLM, Fireworks)
# torch is deliberately NOT listed: it must be the platform build (ROCm on MI300X) installed beforehand;
# letting pip resolve it can replace the ROCm wheel with a CUDA/CPU one. vLLM lives in its own venv
# (scripts/install_vllm_rocm.sh) because its wheel pins its own torch.
train = ["transformers>=4.51", "peft>=0.13", "accelerate", "datasets", "pyyaml"]
dev = ["httpx2", "pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
berkelium = "berkelium.cli:main"

[tool.setuptools.packages.find]
include = ["berkelium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "occt: requires the OCCT (OCP) backend",
  "mesh: requires the Manifold backend",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S307"]   # S307 = forbid eval()
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"berkelium/cli.py" = ["E702"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
