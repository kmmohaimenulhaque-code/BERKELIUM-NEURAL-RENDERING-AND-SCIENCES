# Qwen3-32B bf16 LoRA SFT on one MI300X (ADR-008). Values are starting points to be confirmed by the smoke test.
model: Qwen/Qwen3-32B
revision: main            # pin to a commit hash at download time
dtype: bfloat16
attn_implementation: sdpa # switch to flash_attention_2 only after profiling on ROCm
gradient_checkpointing: true
max_length: 8192
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 2
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 5
  eval_steps: 50
  save_steps: 100
  seed: 0
data:
  train: out/sft/train.chat.jsonl
  val: out/sft/val.chat.jsonl
  assistant_only_loss: true
output_dir: training/runs/qwen3-32b-lora
