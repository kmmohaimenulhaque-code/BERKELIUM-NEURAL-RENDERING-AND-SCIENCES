# AGENT-V2 SFT: Qwen3-32B bf16 LoRA on VERIFIED ClaimEnv (V1) + ModelEnv (model-construction) trajectories.
# New versioned adapter; BASE, M1 and AGENT-V1 adapters are never overwritten.
model: Qwen/Qwen3-32B
revision: main
dtype: bfloat16
attn_implementation: sdpa
gradient_checkpointing: true
max_length: 6144
lora: {r: 32, alpha: 64, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
train: {epochs: 3, per_device_batch_size: 1, gradient_accumulation_steps: 16, learning_rate: 1.0e-4, lr_scheduler: cosine,
        warmup_ratio: 0.05, weight_decay: 0.0, logging_steps: 5, eval_steps: 25, save_steps: 50, seed: 0}
data: {train: out/agent_v2/train.chat.jsonl, val: out/agent_v2/val.chat.jsonl}
output_dir: training/runs/qwen3-32b-lora-agent-v2
